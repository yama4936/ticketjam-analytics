map $http_cf_connecting_ip $visitor_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 64k;
  if ($http_x_forwarded_proto = http) {
    return 308 https://tickets.yama.asia$request_uri;
  }
  proxy_set_header X-Forwarded-For $visitor_ip;
  proxy_set_header Host $host;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:4381;
  location /api/ { proxy_pass $api; proxy_read_timeout 35s; }
  location = /healthz { proxy_pass $api; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location / { try_files $uri $uri/ /index.html; }
}
