name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: ticketjam
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: ticketjam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketjam -d ticketjam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ticketjam:ci-only-test-password@127.0.0.1:5432/ticketjam_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
